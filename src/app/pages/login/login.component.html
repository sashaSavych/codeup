<p-card header="Вхід">
  <form class="flex max-w-md flex-col gap-4" (ngSubmit)="onSubmit()" [formGroup]="form">
    @if (blockedNotice) {
      <p-message severity="warn" [text]="blockedNotice" [closable]="false" />
    }
    @if (errorMessage) {
      <p-message severity="error" [text]="errorMessage" [closable]="false" />
    }

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-slate-700" for="ln-email">Електронна пошта</label>
      <input
        pInputText
        id="ln-email"
        type="email"
        autocomplete="email"
        class="w-full"
        formControlName="email"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-slate-700" for="ln-password">Пароль</label>
      <p-password
        id="ln-password"
        formControlName="password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="current-password"
      />
    </div>

    <p-button type="submit" label="Увійти" icon="pi pi-sign-in" [loading]="submitting" />
  </form>
</p-card>
