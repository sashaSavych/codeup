@if (loading) {
  <p class="text-slate-600">Завантаження…</p>
} @else {
  <p-card header="Мій профіль">
    @if (user(); as u) {
      <p class="cu-email-strip mb-4 text-sm">
        <span class="cu-email-label">Електронна пошта:</span>
        <span class="cu-email-value ml-1">{{ u.email }}</span>
      </p>
    }

    @if (errorMessage) {
      <p-message class="mb-4 block" severity="error" [text]="errorMessage" [closable]="false" />
    }
    @if (successMessage) {
      <p-message class="mb-4 block" severity="success" [text]="successMessage" [closable]="false" />
    }

    <form class="flex max-w-xl flex-col gap-4" (ngSubmit)="save()" [formGroup]="form">
      <div class="flex flex-col gap-2">
        <label class="cu-field-label" for="pf-first">Імʼя</label>
        <input pInputText id="pf-first" class="w-full" formControlName="first_name" autocomplete="given-name" />
      </div>

      <div class="flex flex-col gap-2">
        <label class="cu-field-label" for="pf-last">Прізвище</label>
        <input pInputText id="pf-last" class="w-full" formControlName="last_name" autocomplete="family-name" />
      </div>

      <div class="flex flex-col gap-2">
        <label class="cu-field-label" for="pf-gender">Стать</label>
        <select id="pf-gender" formControlName="gender" class="cu-select w-full">
          <option value="">Оберіть стать</option>
          @for (opt of genderOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label class="cu-field-label" for="pf-class">Клас</label>
        <input
          pInputText
          id="pf-class"
          class="w-full"
          formControlName="class_name"
          placeholder="Наприклад: 9-А"
          autocomplete="off"
        />
      </div>

      <div class="flex flex-wrap gap-2">
        <p-button type="submit" label="Зберегти" icon="pi pi-save" [loading]="saving" />
        <p-button
          type="button"
          label="Вийти"
          icon="pi pi-sign-out"
          severity="secondary"
          [outlined]="true"
          (onClick)="logout()"
        />
      </div>
    </form>
  </p-card>
}
