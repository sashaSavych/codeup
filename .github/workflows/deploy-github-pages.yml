# Build Angular and deploy static output to GitHub Pages.
#
# If https://<user>.github.io/<repo>/ shows README.md (even from "Visit site"):
#   1) Repo → Settings → Pages → Build and deployment → Source = GitHub Actions
#      (not "Deploy from a branch" with /(root) — that serves the repo without app index.html).
#   2) Actions → "Deploy GitHub Pages": latest run must be green; open it and approve
#      if the job waits on the "github-pages" environment (first-time / protection rules).
#   3) Re-run the workflow after changing Pages source.
#
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use Repository Variables and/or Secrets (same names). Prefer Secrets for SUPABASE_PUBLISHABLE_KEY.
      - name: Write environment for Pages build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          CHAT_AI_ENDPOINT: ${{ vars.CHAT_AI_ENDPOINT || secrets.CHAT_AI_ENDPOINT }}
        run: node scripts/write-pages-environment.mjs

      - name: Build application
        run: >
          npx ng build
          --configuration=github-pages
          --base-href=/${{ github.event.repository.name }}/

      - name: Verify Pages bundle
        run: |
          test -f dist/codeup/browser/index.html || (echo 'Missing dist/codeup/browser/index.html — check outputPath in angular.json'; exit 1)
          echo "Repository name (base href segment): ${{ github.event.repository.name }}"
          ls -la dist/codeup/browser | head -n 20

      - name: SPA fallback and disable Jekyll
        run: |
          cp dist/codeup/browser/index.html dist/codeup/browser/404.html
          touch dist/codeup/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/codeup/browser
          # Default excludes dotfiles; .nojekyll must be in the artifact for GitHub Pages.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
