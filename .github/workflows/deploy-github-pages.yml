# Build Angular and deploy static output to GitHub Pages.
#
# If https://<user>.github.io/<repo>/ shows README.md (even from "Visit site"):
#   1) Repo → Settings → Pages → Build and deployment → Source = GitHub Actions
#      (not "Deploy from a branch" with /(root) — that serves the repo without app index.html).
#   2) Actions → "Deploy GitHub Pages": latest run must be green; open it and approve
#      if the job waits on the "github-pages" environment (first-time / protection rules).
#   3) Re-run the workflow after changing Pages source.
#
# Supabase URL/key: use Repository → Settings → Secrets and variables → Actions (repo tab),
# OR define them on the `github-pages` environment — the build job uses that environment so
# env-scoped vars/secrets are visible (without `environment:`, only repo/org-level vars apply).
# https://docs.github.com/en/actions/learn-github-actions/contexts#vars-context
#
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# GitHub Actions runners: use Node 24 for JavaScript-based actions (checkout, setup-node, …).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Required so `vars.*` / `secrets.*` from the `github-pages` environment are available to this job.
    environment: github-pages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Confirms inputs reached the runner without printing secret values (GitHub may still mask in logs).
      - name: Verify Supabase inputs for Pages build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [ -z "${SUPABASE_URL:-}" ]; then echo "::error::SUPABASE_URL is empty. Add repository Actions variable/secret, or set it on the github-pages environment (exact name)."; missing=1; fi
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then echo "::error::SUPABASE_PUBLISHABLE_KEY is empty. Same as SUPABASE_URL."; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "OK: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are non-empty for this build (values are not logged)."

      # Use Repository Variables and/or Secrets (same names). Prefer Secrets for SUPABASE_PUBLISHABLE_KEY.
      - name: Write environment for Pages build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          CHAT_AI_ENDPOINT: ${{ vars.CHAT_AI_ENDPOINT || secrets.CHAT_AI_ENDPOINT }}
        run: node scripts/write-pages-environment.mjs

      - name: Build application
        run: >
          npx ng build
          --configuration=github-pages
          --base-href=/${{ github.event.repository.name }}/

      - name: Verify Pages bundle
        run: |
          test -f dist/codeup/browser/index.html || (echo 'Missing dist/codeup/browser/index.html — check outputPath in angular.json'; exit 1)
          echo "Repository name (base href segment): ${{ github.event.repository.name }}"
          ls -la dist/codeup/browser | head -n 20

      - name: SPA fallback and disable Jekyll
        run: |
          cp dist/codeup/browser/index.html dist/codeup/browser/404.html
          touch dist/codeup/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/codeup/browser
          # Default excludes dotfiles; .nojekyll must be in the artifact for GitHub Pages.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
